<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Oportunidades Agroalimentarias</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --warning: #d97706;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .app-card {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        header {
            margin-bottom: 24px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .grid-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .input-control {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: var(--primary);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .metric-card.success { border-left-color: var(--success); }
        .metric-card.warning { border-left-color: var(--warning); }
        .metric-card.danger { border-left-color: var(--danger); }

        .metric-card h3 {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .metric-card p {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }

        th {
            background: #f8fafc;
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-alta { background: #dcfce7; color: #166534; }
        .badge-baja { background: #fee2e2; color: #991b1b; }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-card">
        <header>
            <h1>Plataforma de Oportunidades Agroalimentarias</h1>
            <p>Panel de control y gestión de datos provinciales y estacionales</p>
        </header>

        <!-- Filtros de Búsqueda -->
        <div class="grid-filters">
            <div class="field-group">
                <label for="provinciaSelect">Provincia</label>
                <select id="provinciaSelect" class="input-control">
                    <option value="">Todas las provincias</option>
                    <option value="Manabí">Manabí</option>
                    <option value="Guayas">Guayas</option>
                    <option value="Los Ríos">Los Ríos</option>
                </select>
            </div>

            <div class="field-group">
                <label for="mesSelect">Mes Pico de Producción</label>
                <select id="mesSelect" class="input-control">
                    <option value="">Todos los meses</option>
                    <option value="Enero">Enero</option>
                    <option value="Julio">Julio</option>
                    <option value="Diciembre">Diciembre</option>
                </select>
            </div>

            <div class="field-group">
                <label for="searchInput">Buscar producto</label>
                <input type="text" id="searchInput" class="input-control" placeholder="Ej. Cacao, Maíz...">
            </div>
        </div>

        <!-- Indicadores Clave -->
        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Total Registros</h3>
                <p id="totalRegistros">0</p>
            </div>
            <div class="metric-card success">
                <h3>Demanda Estimada</h3>
                <p id="demandaPromedio">Alta</p>
            </div>
            <div class="metric-card warning">
                <h3>Meses Pico Activos</h3>
                <p id="picosCount">0</p>
            </div>
        </div>

        <!-- Tabla de Datos -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Provincia</th>
                        <th>Producto</th>
                        <th>Mes Pico</th>
                        <th>Demanda</th>
                    </tr>
                </thead>
                <tbody id="tbodyData">
                    <!-- Los datos se inyectarán dinámicamente mediante JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Base de datos simulada inicial
        const dbData = [
            { id: 1, provincia: "Manabí", producto: "Cacao Fino de Aroma", mes: "Julio", demanda: "Alta" },
            { id: 2, provincia: "Guayas", producto: "Arroz Semilla", mes: "Enero", demanda: "Alta" },
            { id: 3, provincia: "Los Ríos", producto: "Maíz Duro", mes: "Diciembre", demanda: "Media" },
            { id: 4, provincia: "Manabí", producto: "Plátano Orito", mes: "Julio", demanda: "Alta" },
            { id: 5, provincia: "Guayas", producto: "Soya", mes: "Enero", demanda: "Baja" },
            { id: 6, provincia: "Manabí", producto: "Queso Manaba", mes: "Diciembre", demanda: "Alta" }
        ];

        const tbody = document.getElementById('tbodyData');
        const provinciaSelect = document.getElementById('provinciaSelect');
        const mesSelect = document.getElementById('mesSelect');
        const searchInput = document.getElementById('searchInput');
        const totalRegistros = document.getElementById('totalRegistros');
        const picosCount = document.getElementById('picosCount');

        function renderTable(data) {
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No se encontraron registros coincidentes.</td></tr>`;
                totalRegistros.textContent = '0';
                picosCount.textContent = '0';
                return;
            }

            let picosUnicos = new Set();

            data.forEach(item => {
                picosUnicos.add(item.mes);
                const badgeClass = item.demanda === 'Alta' ? 'badge-alta' : 'badge-baja';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td><strong>${item.provincia}</strong></td>
                    <td>${item.producto}</td>
                    <td>${item.mes}</td>
                    <td><span class="badge ${badgeClass}">${item.demanda}</span></td>
                `;
                tbody.appendChild(row);
            });

            totalRegistros.textContent = data.length;
            picosCount.textContent = picosUnicos.size;
        }

        function filtrarDatos() {
            const provinciaVal = provinciaSelect.value.toLowerCase();
            const mesVal = mesSelect.value.toLowerCase();
            const searchVal = searchInput.value.toLowerCase();

            const resultadosFiltrados = dbData.filter(item => {
                const matchProvincia = provinciaVal === '' || item.provincia.toLowerCase().includes(provinciaVal);
                const matchMes = mesVal === '' || item.mes.toLowerCase().includes(mesVal);
                const matchSearch = searchVal === '' || item.producto.toLowerCase().includes(searchVal);
                return matchProvincia && matchMes && matchSearch;
            });

            renderTable(resultadosFiltrados);
        }

        // Eventos de escucha para los filtros
        provinciaSelect.addEventListener('change', filtrarDatos);
        mesSelect.addEventListener('change', filtrarDatos);
        searchInput.addEventListener('input', filtrarDatos);

        // Inicializar la tabla al cargar
        renderTable(dbData);
    </script>
</body>
</html>
